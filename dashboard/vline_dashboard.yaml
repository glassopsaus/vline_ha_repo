# Paste into: dashboard > pencil (edit) > three dots > Raw configuration editor
# (replace everything in the editor with this)
title: V/Line
views:
  - title: Ballan Services
    path: ballan
    icon: mdi:train-variant
    cards:
      - type: grid            # two route cards side by side
        columns: 2
        square: false
        cards:
          - type: custom:vline-train-card
            entity: sensor.vline_ballan_to_ballarat
            title: Ballan to Ballarat
          - type: custom:vline-train-card
            entity: sensor.vline_ballan_to_southern_cross
            title: Ballan to Southern Cross
            direction: rtl     # trains from Ballarat arrive right to left (eastbound)
      - type: grid            # two journey planners: pick any From / To (the second list only offers direct-service stations)
        columns: 2
        square: false
        cards:
          - type: custom:vline-journey-card
            title: Journey planner
            from: Ballarat
            to: Southern Cross
          - type: custom:vline-journey-card
            title: Journey planner
            from: Southern Cross
            to: Bendigo

  - title: V/Line Network
    path: vline-network
    icon: mdi:train
    panel: true            # straight tube-map lines, each leaving Melbourne on its true compass bearing, plain background
    cards:
      - type: custom:vline-network-card
        headings: official     # official = V/Line map style (45-degree lines); compass = exact true bearings
        train_labels: always   # always | zoom | off   (number, origin and destination beside each train)

  - title: Full Victorian Network
    path: victoria
    icon: mdi:map
    panel: true            # official Transport Victoria map with live Metro + V/Line trains
    cards:
      - type: custom:vic-network-card
